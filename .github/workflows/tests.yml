name: ISL public verification
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit and conformance tests
        run: python -m unittest discover -s tests -v
      - name: P1 language example
        run: python -m spectral_public.cli run examples/hello.isl
      - name: P2 adapter binding and diagnostics
        run: |
          python -m spectral_public.cli adapter-check examples/p2_requests.json examples/p2_predictions.json
          python -m spectral_public.cli evaluate examples/p2_requests.json examples/p2_predictions.json examples/p2_heldout.json
